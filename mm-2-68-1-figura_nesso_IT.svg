<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 488" role="img" aria-label="Un solo conteggio dà tempo, spazio, massa e oggetti" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Un solo conteggio dà tempo, spazio, massa e oggetti</title>
  <rect x="0" y="0" width="760" height="488" fill="#ffffff"/>
  <defs>
    <marker id="freccia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a8a85"/>
    </marker>
  </defs>
  <text x="24" y="28" font-size="15" font-weight="600" fill="#1f1f1d">Un solo conteggio dà tempo, spazio, massa e oggetti</text>
  <g fill="none" stroke="#8a8a85" stroke-width="1.25">
    <path d="M380 120V158" marker-end="url(#freccia)"/>
    <path d="M290 232V256H190V278" marker-end="url(#freccia)"/>
    <path d="M470 232V256H570V278" marker-end="url(#freccia)"/>
    <path d="M190 352V390" marker-end="url(#freccia)"/>
    <path d="M570 352V390" marker-end="url(#freccia)"/>
    <path d="M344 322H416" marker-start="url(#freccia)" marker-end="url(#freccia)"/>
  </g>
  <rect x="200" y="48" width="360" height="72" rx="8" fill="#e3edfb" stroke="#2f6fd0" stroke-width="2"/>
  <text x="380" y="72" text-anchor="middle" font-weight="600" fill="#1f1f1d">Nesso non locale</text>
  <text x="380" y="92" text-anchor="middle" font-size="11.5" fill="#1f1f1d">lo spazio non è il tempo; in comune solo l'MCD</text>
  <text x="380" y="108" text-anchor="middle" font-size="11.5" fill="#5f5f5a">come 3 e 5, che hanno in comune solo 1</text>
  <text x="392" y="144" font-size="11.5" fill="#5f5f5a">contato attraverso l'MCD</text>
  <rect x="200" y="160" width="360" height="72" rx="8" fill="none" stroke="#8a8a85" stroke-width="1.25"/>
  <text x="380" y="184" text-anchor="middle" font-weight="600" fill="#1f1f1d">Matrice di chi osserva</text>
  <text x="380" y="204" text-anchor="middle" font-size="11.5" fill="#1f1f1d">multipli e frazioni dello stesso MCD</text>
  <text x="380" y="220" text-anchor="middle" font-size="11.5" fill="#5f5f5a">letti da un osservatore che sta dentro</text>
  <rect x="40" y="280" width="300" height="72" rx="8" fill="none" stroke="#8a8a85" stroke-width="1.25"/>
  <text x="190" y="304" text-anchor="middle" font-weight="600" fill="#1f1f1d">Multipli</text>
  <text x="190" y="324" text-anchor="middle" font-size="11.5" fill="#1f1f1d">letti: il tempo degli orologi</text>
  <text x="190" y="340" text-anchor="middle" font-size="11.5" fill="#1f1f1d">contenuti: la massa, invariante</text>
  <rect x="420" y="280" width="300" height="72" rx="8" fill="none" stroke="#8a8a85" stroke-width="1.25"/>
  <text x="570" y="304" text-anchor="middle" font-weight="600" fill="#1f1f1d">Frazioni</text>
  <text x="570" y="324" text-anchor="middle" font-size="11.5" fill="#1f1f1d">lette: lo spazio e le distanze</text>
  <text x="570" y="340" text-anchor="middle" font-size="11.5" fill="#1f1f1d">in comune fra due letture: gli oggetti</text>
  <text x="380" y="312" text-anchor="middle" font-size="11.5" fill="#5f5f5a">c: il cambio</text>
  <rect x="40" y="392" width="680" height="72" rx="8" fill="#f1f0ec" stroke="#8a8a85" stroke-width="1.25"/>
  <text x="380" y="416" text-anchor="middle" font-weight="600" fill="#1f1f1d">Sotto una soglia di massa</text>
  <text x="380" y="436" text-anchor="middle" font-size="11.5" fill="#1f1f1d">l'MCD di chi osserva e quello che genera l'oggetto si equivalgono:</text>
  <text x="380" y="452" text-anchor="middle" font-size="11.5" fill="#1f1f1d">l'oggetto si distribuisce su più posizioni e lo leggiamo come probabilità</text>
</svg>
